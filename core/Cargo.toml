[package]
edition = "2024"
name = "minusone"
version = "0.5.0"
authors = ["Airbus CERT <cert@airbus.com>"]
description = "A script deobfuscator"
repository = "https://github.com/airbus-cert/minusone"
readme = "README.md"
license = "MIT"

[lib]
name = "minusone"
path = "src/lib.rs"

[features]
# The reason we do this is because doctests don't get cfg(test)
# See: https://github.com/rust-lang/cargo/issues/4669
integration = []

[dependencies]
aes = "0.9.2"
base64 = { workspace = true }
cbc = "0.2.1"
cfb8 = "0.9.1"
colored = "3"
ecb = "0.2.0"
flate2 = { version = "1.1.5", default-features = false, features = ["rust_backend"] }
half = "2.7.1"
indexmap = "2"
log = { workspace = true }
num = "0.4.3"
num-bigint = "0.4.6"
rand = "0.10.1"
regex = "1.11.1"
self_cell = "1.3.0"
tree-sitter = "0.25"
tree-sitter-javascript = "0.25.0"
tree-sitter-powershell = { git = "https://github.com/UwUDev/tree-sitter-powershell.git" }
tree-sitter-traversal2 = "0.2.1"
